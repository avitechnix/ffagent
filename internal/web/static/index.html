<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ffagent">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070a12" media="(prefers-color-scheme: dark)">
<title>ffagent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="alternate icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <img class="logo" src="logo.svg" alt="" width="40" height="40">
      <div class="brand-text">
        <h1 id="team">ffagent</h1>
        <div id="subtitle" class="chips"><span class="chip">Loading…</span></div>
      </div>
    </div>
    <button id="refresh" class="icon-btn" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    </button>
  </div>
  <div id="mode" class="pill" hidden></div>
</header>

<div id="ptr" class="ptr" aria-hidden="true">
  <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
</div>

<main>
  <section id="tab-moves" class="tab" aria-labelledby="t-moves">
    <div id="moves"></div>
  </section>
  <section id="tab-matchup" class="tab" aria-labelledby="t-matchup" hidden>
    <div id="matchup"></div>
  </section>
  <section id="tab-ask" class="tab" aria-labelledby="t-ask" hidden>
    <div id="ask"></div>
  </section>
  <section id="tab-roster" class="tab" aria-labelledby="t-roster" hidden>
    <div id="roster"></div>
  </section>
  <section id="tab-history" class="tab" aria-labelledby="t-history" hidden>
    <div id="history"></div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<nav class="tabbar" role="tablist">
  <button id="t-moves" role="tab" data-tab="moves" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
    <span>Moves</span><b id="badge" class="badge" hidden></b>
  </button>
  <button id="t-matchup" role="tab" data-tab="matchup" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 13h4v8H3zm7-6h4v14h-4zm7-4h4v18h-4z"/></svg>
    <span>Matchup</span>
  </button>
  <button id="t-ask" role="tab" data-tab="ask" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2zm4.5 6.5a1.5 1.5 0 1 0 0 .01zm3.5 0a1.5 1.5 0 1 0 0 .01zm3.5 0a1.5 1.5 0 1 0 0 .01z"/></svg>
    <span>Ask</span>
  </button>
  <button id="t-roster" role="tab" data-tab="roster" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1a4.2 4.2 0 0 1 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/></svg>
    <span>Roster</span>
  </button>
  <button id="t-history" role="tab" data-tab="history" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.1 5L6.7 18.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8z"/></svg>
    <span>History</span>
  </button>
</nav>
</body>
</html>
